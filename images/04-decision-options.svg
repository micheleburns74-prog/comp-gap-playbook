<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1120" viewBox="0 0 1650 1120" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Three options for the hiring manager: raise the range, keep it, or widen the search</title>
  <rect width="1650" height="1120" fill="#f4f7f9"/>
  <rect x="60" y="0" width="1530" height="1120" fill="#ffffff"/>
  <text x="120" y="110" font-size="56" font-weight="700" fill="#13293d">The decision</text>
  <rect x="120" y="136" width="1410" height="3" fill="#13293d"/>
  <text x="120" y="196" font-size="27" fill="#13293d">Three options for the hiring manager, with the trade-off for each.</text>
  <rect x="120" y="290" width="450" height="640" rx="12" fill="#eef6f8"/>
  <rect x="120" y="290" width="450" height="12" rx="6" fill="#1b7a8c"/>
  <text x="152" y="365" font-size="32" font-weight="700" fill="#13293d">A. Raise the range</text>
  <rect x="152" y="399" width="200" height="40" rx="20" fill="#1b7a8c"/>
  <text x="252" y="426" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">RECOMMENDED</text>
  <text x="152" y="487" font-size="27" font-weight="400" fill="#13293d">Floor to 70,000, top held at</text>
  <text x="152" y="524" font-size="27" font-weight="400" fill="#13293d">90,000. Midpoint becomes</text>
  <text x="152" y="561" font-size="27" font-weight="400" fill="#13293d">80,000.</text>
  <text x="152" y="648" font-size="20" font-weight="700" fill="#1b7a8c" letter-spacing="1.5">TRADE-OFF</text>
  <text x="152" y="688" font-size="27" font-weight="400" fill="#13293d">Keeps specialists in the</text>
  <text x="152" y="725" font-size="27" font-weight="400" fill="#13293d">conversation. Does not make</text>
  <text x="152" y="762" font-size="27" font-weight="400" fill="#13293d">us the top payer.</text>
  <rect x="600" y="290" width="450" height="640" rx="12" fill="#f6f8fa"/>
  <rect x="600" y="290" width="450" height="12" rx="6" fill="#5b6b7a"/>
  <text x="632" y="365" font-size="32" font-weight="700" fill="#13293d">B. Keep the range</text>
  <text x="632" y="427" font-size="27" font-weight="400" fill="#13293d">Accept a longer time to fill</text>
  <text x="632" y="464" font-size="27" font-weight="400" fill="#13293d">and a less experienced hire</text>
  <text x="632" y="501" font-size="27" font-weight="400" fill="#13293d">we train.</text>
  <text x="632" y="588" font-size="20" font-weight="700" fill="#1b7a8c" letter-spacing="1.5">TRADE-OFF</text>
  <text x="632" y="628" font-size="27" font-weight="400" fill="#13293d">Expect 3 to 6 more months</text>
  <text x="632" y="665" font-size="27" font-weight="400" fill="#13293d">and more offer declines.</text>
  <rect x="1080" y="290" width="450" height="640" rx="12" fill="#f6f8fa"/>
  <rect x="1080" y="290" width="450" height="12" rx="6" fill="#5b6b7a"/>
  <text x="1112" y="365" font-size="32" font-weight="700" fill="#13293d">C. Keep the range,</text>
  <text x="1112" y="407" font-size="32" font-weight="700" fill="#13293d">widen the map</text>
  <text x="1112" y="469" font-size="27" font-weight="400" fill="#13293d">Search outside the main hub,</text>
  <text x="1112" y="506" font-size="27" font-weight="400" fill="#13293d">where expectations run</text>
  <text x="1112" y="543" font-size="27" font-weight="400" fill="#13293d">lower.</text>
  <text x="1112" y="630" font-size="20" font-weight="700" fill="#1b7a8c" letter-spacing="1.5">TRADE-OFF</text>
  <text x="1112" y="670" font-size="27" font-weight="400" fill="#13293d">Much smaller pool, because</text>
  <text x="1112" y="707" font-size="27" font-weight="400" fill="#13293d">specialist talent clusters</text>
  <text x="1112" y="744" font-size="27" font-weight="400" fill="#13293d">in major cities.</text>
  <text x="120" y="990" font-size="26" fill="#13293d">If the band stays put, the job description has to move toward what the band can buy.</text>
  <text x="120" y="1088" font-size="21" fill="#5b6b7a">All figures and roles are illustrative. No employer or candidate data.</text>
</svg>
