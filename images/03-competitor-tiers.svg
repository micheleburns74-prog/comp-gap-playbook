<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1120" viewBox="0 0 1650 1120" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Three employer tiers and what each brings at the current pay band</title>
  <rect width="1650" height="1120" fill="#f4f7f9"/>
  <rect x="60" y="0" width="1530" height="1120" fill="#ffffff"/>
  <text x="120" y="110" font-size="56" font-weight="700" fill="#13293d">Where we can hire from</text>
  <rect x="120" y="136" width="1410" height="3" fill="#13293d"/>
  <text x="120" y="196" font-size="27" fill="#13293d">Three groups of employers, and what each brings at our current band.</text>
  <rect x="120" y="290" width="450" height="560" rx="12" fill="#eef6f8"/>
  <rect x="120" y="290" width="450" height="12" rx="6" fill="#c2603a"/>
  <text x="152" y="360" font-size="40" font-weight="700" fill="#13293d">Tier 1</text>
  <text x="152" y="420" font-size="28" font-weight="700" fill="#1b7a8c">Specialist storage and</text>
  <text x="152" y="459" font-size="28" font-weight="700" fill="#1b7a8c">energy employers</text>
  <text x="152" y="528" font-size="27" font-weight="400" fill="#13293d">The exact skills, at a</text>
  <text x="152" y="565" font-size="27" font-weight="400" fill="#13293d">higher price than the band</text>
  <text x="152" y="602" font-size="27" font-weight="400" fill="#13293d">allows.</text>
  <rect x="600" y="290" width="450" height="560" rx="12" fill="#eef6f8"/>
  <rect x="600" y="290" width="450" height="12" rx="6" fill="#1b7a8c"/>
  <text x="632" y="360" font-size="40" font-weight="700" fill="#13293d">Tier 2</text>
  <text x="632" y="420" font-size="28" font-weight="700" fill="#1b7a8c">Power, grid and renewables</text>
  <text x="632" y="459" font-size="28" font-weight="700" fill="#1b7a8c">employers</text>
  <text x="632" y="528" font-size="27" font-weight="400" fill="#13293d">Energy background, but</text>
  <text x="632" y="565" font-size="27" font-weight="400" fill="#13293d">usually mid-level and</text>
  <text x="632" y="602" font-size="27" font-weight="400" fill="#13293d">without deep storage</text>
  <text x="632" y="639" font-size="27" font-weight="400" fill="#13293d">knowledge.</text>
  <rect x="1080" y="290" width="450" height="560" rx="12" fill="#eef6f8"/>
  <rect x="1080" y="290" width="450" height="12" rx="6" fill="#7fb8c4"/>
  <text x="1112" y="360" font-size="40" font-weight="700" fill="#13293d">Tier 3</text>
  <text x="1112" y="420" font-size="28" font-weight="700" fill="#1b7a8c">Technical selling in other</text>
  <text x="1112" y="459" font-size="28" font-weight="700" fill="#1b7a8c">industries</text>
  <text x="1112" y="528" font-size="27" font-weight="400" fill="#13293d">Strong selling skills, but</text>
  <text x="1112" y="565" font-size="27" font-weight="400" fill="#13293d">no energy background.</text>
  <rect x="120" y="890" width="1410" height="130" rx="10" fill="#fdf3ee"/>
  <rect x="120" y="890" width="8" height="130" fill="#c2603a"/>
  <text x="160" y="942" font-size="28" font-weight="700" fill="#13293d">Read tier numbers as base pay only.</text>
  <text x="160" y="984" font-size="26" fill="#13293d">Ads and salary sites rarely publish bonus, commission or a car, so compare base with base.</text>
  <text x="120" y="1088" font-size="21" fill="#5b6b7a">All figures and roles are illustrative. No employer or candidate data.</text>
</svg>
