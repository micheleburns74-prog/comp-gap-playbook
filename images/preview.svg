<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1120" viewBox="0 0 1650 1120" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The gap at a glance: illustrative pay band versus a matching candidate</title>
  <rect width="1650" height="1120" fill="#f4f7f9"/>
  <rect x="60" y="0" width="1530" height="1120" fill="#ffffff"/>

  <text x="120" y="110" font-size="56" font-weight="700" fill="#13293d">The gap at a glance</text>
  <rect x="120" y="136" width="1410" height="3" fill="#13293d"/>
  <text x="120" y="196" font-size="27" fill="#13293d">Illustrative annual base pay in euros: where our band sits against what a</text>
  <text x="120" y="232" font-size="27" fill="#13293d">candidate who matches the job description expects.</text>

  <text x="120" y="320" font-size="34" font-weight="700" fill="#1b7a8c">Specialist job description, generalist pay range</text>

  <g stroke="#e3e9ee" stroke-width="2">
    <line x1="330" y1="450" x2="330" y2="830"/>
    <line x1="476.25" y1="450" x2="476.25" y2="830"/>
    <line x1="622.5" y1="450" x2="622.5" y2="830"/>
    <line x1="768.75" y1="450" x2="768.75" y2="830"/>
    <line x1="915" y1="450" x2="915" y2="830"/>
    <line x1="1061.25" y1="450" x2="1061.25" y2="830"/>
    <line x1="1207.5" y1="450" x2="1207.5" y2="830"/>
    <line x1="1353.75" y1="450" x2="1353.75" y2="830"/>
    <line x1="1500" y1="450" x2="1500" y2="830"/>
  </g>

  <g font-size="22" fill="#5b6b7a" text-anchor="middle">
    <text x="330" y="866">50k</text>
    <text x="476.25" y="866">60k</text>
    <text x="622.5" y="866">70k</text>
    <text x="768.75" y="866">80k</text>
    <text x="915" y="866">90k</text>
    <text x="1061.25" y="866">100k</text>
    <text x="1207.5" y="866">110k</text>
    <text x="1353.75" y="866">120k</text>
    <text x="1500" y="866">130k</text>
  </g>

  <g font-size="26" fill="#13293d" text-anchor="end" font-weight="600">
    <text x="300" y="528">Our base pay</text>
    <text x="300" y="648">Base + 20% bonus</text>
    <text x="300" y="758">Matching candidate</text>
    <text x="300" y="790" font-weight="400" fill="#5b6b7a" font-size="22">(base only)</text>
  </g>

  <rect x="476.25" y="498" width="438.75" height="44" rx="6" fill="#1b7a8c"/>
  <line x1="695.6" y1="492" x2="695.6" y2="548" stroke="#ffffff" stroke-width="4"/>
  <text x="466" y="528" font-size="22" fill="#13293d" text-anchor="end">60,000</text>
  <text x="926" y="528" font-size="22" fill="#13293d">90,000</text>

  <rect x="649.7" y="618" width="528.3" height="44" rx="6" fill="#7fb8c4"/>
  <text x="640" y="648" font-size="22" fill="#13293d" text-anchor="end">72,000</text>
  <text x="1190" y="648" font-size="22" fill="#13293d">108,000</text>

  <rect x="861.4" y="738" width="497.35" height="44" rx="6" fill="#c2603a"/>
  <line x1="1066.25" y1="732" x2="1066.25" y2="788" stroke="#ffffff" stroke-width="4"/>
  <text x="851" y="768" font-size="22" fill="#13293d" text-anchor="end">86,000</text>
  <text x="1370" y="768" font-size="22" fill="#13293d">120,000</text>

  <line x1="1066.25" y1="450" x2="1066.25" y2="830" stroke="#c2603a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1066.25" y="432" font-size="23" font-weight="600" fill="#c2603a" text-anchor="middle">Matching candidate middle: 100,000</text>

  <rect x="120" y="920" width="1410" height="120" rx="10" fill="#eef6f8"/>
  <rect x="120" y="920" width="8" height="120" fill="#1b7a8c"/>
  <text x="160" y="972" font-size="28" font-weight="700" fill="#13293d">Even the top of our base band (90,000) sits 10,000 below</text>
  <text x="160" y="1012" font-size="28" font-weight="700" fill="#13293d">where a matching candidate expects to land in the middle.</text>

  <text x="120" y="1088" font-size="21" fill="#5b6b7a">All figures are illustrative. No employer or candidate data.</text>
</svg>
