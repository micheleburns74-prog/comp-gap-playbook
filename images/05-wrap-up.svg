<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1120" viewBox="0 0 1650 1120" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Wrap-up: four steps for closing a compensation gap</title>
  <rect width="1650" height="1120" fill="#f4f7f9"/>
  <rect x="60" y="0" width="1530" height="1120" fill="#ffffff"/>
  <text x="120" y="110" font-size="56" font-weight="700" fill="#13293d">Wrapping it up</text>
  <rect x="120" y="136" width="1410" height="3" fill="#13293d"/>
  <text x="120" y="196" font-size="27" fill="#13293d">Four steps for the next time a job description and a pay band stop matching.</text>
  <rect x="120" y="270" width="1410" height="150" rx="12" fill="#eef6f8"/>
  <rect x="120" y="270" width="8" height="150" fill="#1b7a8c"/>
  <circle cx="200" cy="345" r="38" fill="#1b7a8c"/>
  <text x="200" y="358" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="270" y="338" font-size="34" font-weight="700" fill="#13293d">Price the job description, not the title</text>
  <text x="270" y="382" font-size="26" fill="#13293d">Benchmark what the duties and requirements cost in the market, not just the job title.</text>
  <rect x="120" y="442" width="1410" height="150" rx="12" fill="#eef6f8"/>
  <rect x="120" y="442" width="8" height="150" fill="#1b7a8c"/>
  <circle cx="200" cy="517" r="38" fill="#1b7a8c"/>
  <text x="200" y="530" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="270" y="510" font-size="34" font-weight="700" fill="#13293d">Compare base with base</text>
  <text x="270" y="554" font-size="26" fill="#13293d">Most ads publish base only. Lead with total target pay, but benchmark like for like.</text>
  <rect x="120" y="614" width="1410" height="150" rx="12" fill="#eef6f8"/>
  <rect x="120" y="614" width="8" height="150" fill="#1b7a8c"/>
  <circle cx="200" cy="689" r="38" fill="#1b7a8c"/>
  <text x="200" y="702" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="270" y="682" font-size="34" font-weight="700" fill="#13293d">Show the gap and the options</text>
  <text x="270" y="726" font-size="26" fill="#13293d">One page: the gap, three choices, and a clear recommendation.</text>
  <rect x="120" y="786" width="1410" height="150" rx="12" fill="#eef6f8"/>
  <rect x="120" y="786" width="8" height="150" fill="#1b7a8c"/>
  <circle cx="200" cy="861" r="38" fill="#1b7a8c"/>
  <text x="200" y="874" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="270" y="854" font-size="34" font-weight="700" fill="#13293d">Ask for a decision</text>
  <text x="270" y="898" font-size="26" fill="#13293d">Move the band, or move the job description toward what the band can buy.</text>
  <text x="120" y="1000" font-size="34" font-weight="700" fill="#c2603a">The market is not wrong. The range is.</text>
  <text x="120" y="1088" font-size="21" fill="#5b6b7a">All figures and roles are illustrative. No employer or candidate data.</text>
</svg>
